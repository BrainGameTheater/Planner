<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Task List</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        
        .container {
            background-color: white;
            padding: 40px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        
        h1 {
            text-align: center;
            color: #333;
            border-bottom: 3px solid #333;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        
        h2 {
            color: #444;
            margin-top: 30px;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #ddd;
        }
        
        .task {
            display: flex;
            align-items: flex-start;
            margin: 12px 0;
            padding: 8px;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        
        .task:hover {
            background-color: #f9f9f9;
        }
        
        .task input[type="checkbox"] {
            margin-right: 12px;
            margin-top: 3px;
            cursor: pointer;
            width: 18px;
            height: 18px;
        }
        
        .task label {
            cursor: pointer;
            flex: 1;
            line-height: 1.5;
        }
        
        .task.completed label {
            color: #999;
            text-decoration: line-through;
        }
        
        .footer {
            text-align: center;
            color: #999;
            font-size: 0.85em;
            margin-top: 40px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Master Task List</h1>
        
        <h2>Content Creation</h2>
        <div class="task">
            <input type="checkbox" id="task1">
            <label for="task1">Write blog post</label>
        </div>
        <div class="task">
            <input type="checkbox" id="task2">
            <label for="task2">Edit video footage</label>
        </div>
        <div class="task">
            <input type="checkbox" id="task3">
            <label for="task3">Create social media graphics</label>
        </div>
        
        <h2>Work Projects</h2>
        <div class="task">
            <input type="checkbox" id="task4">
            <label for="task4">Finish quarterly report</label>
        </div>
        <div class="task">
            <input type="checkbox" id="task5">
            <label for="task5">Client meeting prep</label>
        </div>
        <div class="task">
            <input type="checkbox" id="task6">
            <label for="task6">Review team proposals</label>
        </div>
        
        <h2>Personal</h2>
        <div class="task">
            <input type="checkbox" id="task7">
            <label for="task7">Grocery shopping</label>
        </div>
        <div class="task">
            <input type="checkbox" id="task8">
            <label for="task8">Call dentist</label>
        </div>
        <div class="task">
            <input type="checkbox" id="task9">
            <label for="task9">Schedule car maintenance</label>
        </div>
        
        <div class="footer">
            Customize the project categories above to fit your needs!
        </div>
    </div>

    <script>
        document.querySelectorAll('.task input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const taskDiv = this.parentElement;
                if (this.checked) {
                    taskDiv.classList.add('completed');
                } else {
                    taskDiv.classList.remove('completed');
                }
            });
        });
    </script>
</body>
</html>
